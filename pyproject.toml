[project]
name = "teardown"
version = "0.2.0"
description = "Clean-room, behavior-first analysis of applications: observe black-box, mine falsifiable behavior claims, release a sanitized spec, and differential-test a clean reimplementation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Xintian Huang", email = "731913+lemonadesaltbagel@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "mcp>=2.3",
    "cryptography>=44",
]

[project.optional-dependencies]
learn = ["aalpy>=1.6.2"]
web = ["playwright>=1.64"]

[project.scripts]
teardown = "teardown.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "aalpy>=1.6.2", "playwright>=1.64"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teardown"]

[tool.hatch.build.targets.wheel.force-include]
"docs/observer-playbook.md" = "teardown/observer-playbook.md"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
