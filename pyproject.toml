[project]
name = "teardown"
version = "0.2.0"
description = "Clean-room, behavior-first analysis of applications: observe black-box, mine falsifiable behavior claims, release a sanitized spec, and differential-test a clean reimplementation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Xintian Huang", email = "731913+lemonadesaltbagel@users.noreply.github.com" }]
requires-python = ">=3.12"
keywords = ["clean-room", "reimplementation", "black-box", "mcp", "playwright", "accessibility", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.14",
    "mcp>=2.3",
    "cryptography>=44",
    "aalpy>=1.6.2",  # automata learning; small and pure Python, so `teardown demo` works on a plain install
]

[project.optional-dependencies]
learn = []  # kept for old install commands: learning is part of the default install now
web = ["playwright>=1.64"]

[project.urls]
Homepage = "https://github.com/lemonadesaltbagel/teardown"
Documentation = "https://github.com/lemonadesaltbagel/teardown/tree/main/docs"
Changelog = "https://github.com/lemonadesaltbagel/teardown/blob/main/CHANGELOG.md"
Issues = "https://github.com/lemonadesaltbagel/teardown/issues"

[project.scripts]
teardown = "teardown.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "aalpy>=1.6.2", "playwright>=1.64"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teardown"]

[tool.hatch.build.targets.wheel.force-include]
"docs/observer-playbook.md" = "teardown/observer-playbook.md"
# the room images' build context, so an installed copy can build them (teardown.resources.room_root)
"pyproject.toml" = "teardown/_room/pyproject.toml"
"README.md" = "teardown/_room/README.md"
"LICENSE" = "teardown/_room/LICENSE"
"NOTICE" = "teardown/_room/NOTICE"
"deploy/Dockerfile" = "teardown/_room/deploy/Dockerfile"
"deploy/Dockerfile.clean" = "teardown/_room/deploy/Dockerfile.clean"
"deploy/cleanroom.yaml" = "teardown/_room/deploy/cleanroom.yaml"
"deploy/observerroom.yaml" = "teardown/_room/deploy/observerroom.yaml"
"deploy/compose.yaml" = "teardown/_room/deploy/compose.yaml"
"deploy/clean/managed-settings.json" = "teardown/_room/deploy/clean/managed-settings.json"
"deploy/clean/room-claude" = "teardown/_room/deploy/clean/room-claude"
"deploy/clean/verify" = "teardown/_room/deploy/clean/verify"
"deploy/clean/no-android/.keep" = "teardown/_room/deploy/clean/no-android/.keep"
"deploy/desktop-linux/Dockerfile" = "teardown/_room/deploy/desktop-linux/Dockerfile"
"deploy/desktop-linux/desktop_agent.py" = "teardown/_room/deploy/desktop-linux/desktop_agent.py"
"deploy/android-agent/AndroidManifest.xml" = "teardown/_room/deploy/android-agent/AndroidManifest.xml"
"deploy/android-agent/build.sh" = "teardown/_room/deploy/android-agent/build.sh"
"deploy/android-agent/src" = "teardown/_room/deploy/android-agent/src"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
