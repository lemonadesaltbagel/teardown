<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Teardown: a confined observer studies the target's behavior, the gate releases a sanitized spec, and a confined clean agent rebuilds the feature and gets abstract verdicts back.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="430" rx="18" fill="#f8fafc"/>

  <!-- dirty zone -->
  <rect x="24" y="24" width="560" height="382" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="44" y="56" font-size="20" font-weight="700" fill="#9a3412">Dirty zone (your machine)</text>

  <rect x="44" y="76" width="150" height="70" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="119" y="106" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Target</text>
  <text x="119" y="128" font-size="13" fill="#4b5563" text-anchor="middle">CLI · web · Android</text>

  <rect x="230" y="76" width="334" height="70" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="397" y="104" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Drivers + observe MCP server</text>
  <text x="397" y="126" font-size="13" fill="#4b5563" text-anchor="middle">behavior only: outputs, a11y trees, faults</text>
  <line x1="194" y1="111" x2="228" y2="111" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <rect x="230" y="176" width="334" height="70" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="397" y="204" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Observer room</text>
  <text x="397" y="226" font-size="13" fill="#4b5563" text-anchor="middle">observer agent: rules, probes, claims, unknowns</text>
  <line x1="397" y1="148" x2="397" y2="174" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <rect x="44" y="276" width="520" height="110" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="304" y="306" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Gate</text>
  <text x="304" y="330" font-size="13" fill="#4b5563" text-anchor="middle">verbatim / near-verbatim / real-name checks · your approvals (strict)</text>
  <text x="304" y="352" font-size="13" fill="#4b5563" text-anchor="middle">verifier: runs original vs clone · signed, hash-chained audit log</text>
  <line x1="397" y1="248" x2="397" y2="274" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- clean zone -->
  <rect x="660" y="24" width="516" height="382" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="680" y="56" font-size="20" font-weight="700" fill="#1e40af">Clean room (isolated container)</text>

  <rect x="690" y="96" width="456" height="110" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="918" y="126" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Clean agent</text>
  <text x="918" y="150" font-size="13" fill="#4b5563" text-anchor="middle">reads only the kit (released spec)</text>
  <text x="918" y="172" font-size="13" fill="#4b5563" text-anchor="middle">writes its own implementation · asks the gate to verify</text>

  <rect x="690" y="276" width="456" height="110" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="918" y="306" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Egress proxy</text>
  <text x="918" y="330" font-size="13" fill="#4b5563" text-anchor="middle">only the gate and the model API · every attempt logged</text>
  <text x="918" y="352" font-size="13" fill="#4b5563" text-anchor="middle">no internet, no host, no original, no project</text>
  <line x1="918" y1="208" x2="918" y2="274" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- crossings -->
  <line x1="566" y1="302" x2="688" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="262" font-size="14" font-weight="600" fill="#15803d" text-anchor="middle" transform="rotate(-49 640 262)">released spec</text>
  <line x1="688" y1="352" x2="566" y2="352" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="627" y="378" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">verdicts</text>
</svg>
